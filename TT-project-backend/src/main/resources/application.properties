spring.application.name=expense-tracker
server.port=${PORT:8080}
# File-based H2 so data survives restarts (stored in ./data)
spring.datasource.url=jdbc:h2:file:./data/expensedb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console is off by default. Enable for local debugging with
# SPRING_H2_CONSOLE_ENABLED=true -> http://localhost:8080/h2-console
spring.h2.console.enabled=false

# Return dates as ISO strings (2026-10-12), not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# Frontend origins allowed to call the API (comma separated). Override with APP_CORS_ALLOWED_ORIGINS.
# app.cors.allowed-origins=http://localhost:5500,http://localhost:3000
